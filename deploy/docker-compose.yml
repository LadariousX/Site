services:
  nginx:
    image: nginx:latest
    container_name: nginx-proxy
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      # default: the other services in this file.
      # shared-net: izzy-game, which lives in the ICS-orientation-izzyRun project.
      - default
      - shared-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}

  blog:
    image: go-refresh:v1
    volumes:
      - ../Blog:/workspace/Blog
      - ../common-assets:/workspace/common-assets
    working_dir: /workspace/Blog
    restart: unless-stopped

  tools:
    image: go-refresh:v1
    volumes:
      - ../Tools:/workspace/Tools
      - ../common-assets:/workspace/common-assets
    working_dir: /workspace/Tools
    environment:
      - SURVEY_BOT_BACKEND=http://survey-bot:3000
    restart: unless-stopped

  survey-bot:
    image: survey-bot:v3
    restart: unless-stopped

# shared-net is created once on the host (docker network create shared-net) and
# joined by both this stack and the ICS-orientation-izzyRun stack.
networks:
  shared-net:
    external: true
