server {
    listen 80;
    server_name laydenb.com www.laydenb.com;

    # Lets nginx look up backend names fresh each request, so a backend that's down just 502s instead of crashing nginx on startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_buffer_size      128k;
    proxy_buffers          8 256k;
    proxy_busy_buffers_size 512k;

    # These headers get sent on every proxied request below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Give up and show an error after 5s instead of hanging if a backend won't connect.
    proxy_connect_timeout 5s;

    # Shorthand for our Go backend's address, used by every location below.
    set $upstream_site http://site:8080;

    # redirect people that forget the trailing slash to the real URL.
    location = /ics/izzy-game  { return 302 /ics/izzy-game/; }

    # Shortcut straight to the Tools section of the directory page.
    location = /t { return 302 /dir#Tools; }

    # Bare /l or /l/ (no alias) just sends people to the link manager form.
    location = /l  { return 302 /link-manager; }
    location = /l/ { return 302 /link-manager; }

    location ^~ /l/ {
        proxy_pass $upstream_site;
    }

    # Link manager pages get a bigger upload size limit than the default.
    location ^~ /link-manager {
        proxy_pass $upstream_site;
        client_max_body_size 200m;
    }

    location ^~ /api/link-manager/ {
        proxy_pass $upstream_site;
        client_max_body_size 200m;
    }

    # izzy-game lives in its own separate project, reached over the shared network.
    location ^~ /ics/izzy-game/ {
        set $upstream_izzy http://izzy-game:5003;
        rewrite ^/ics/izzy-game/(.*)$ /$1 break;
        proxy_pass $upstream_izzy;
    }

    # Video files stream straight through instead of buffering to disk first.
    location ~* \.(mp4|mov|webm)$ {
        proxy_pass $upstream_site;
        proxy_buffering off;
    }

    # Everything else just goes straight to the site.
    location / {
        proxy_pass $upstream_site;
    }
}
