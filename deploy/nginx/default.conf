server {
    listen 80;
    server_name laydenb.com www.laydenb.com;

    # Docker's embedded DNS. Every proxy_pass below points at a backend through a
    # variable, which makes nginx resolve the name per request instead of once at
    # startup. A backend that is missing or still booting then returns 502 on its
    # own route only — it can't stop nginx from starting and take the whole site
    # down with it. This matters most for izzy-game, which lives in a separate
    # compose project (ICS-orientation-izzyRun) that may not be running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    proxy_buffer_size      128k;
    proxy_buffers          8 256k;
    proxy_busy_buffers_size 512k;

    # Applied to every proxied location below.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Fail fast to a 502 instead of hanging when a backend is down.
    proxy_connect_timeout 5s;

    # /t and /t/... -> /tools...
    location ~ ^/t(?<suffix>/.*)?$ {
        return 302 /tools$suffix;
    }

    # Nudge the missing-trailing-slash forms onto the real mounts.
    location = /tools          { return 302 /tools/; }
    location = /ics/izzy-game  { return 302 /ics/izzy-game/; }

    # Tools app. ^~ stops the media regex below from claiming .mp4 files here.
    location ^~ /tools/ {
        set $upstream_tools http://tools:5002;
        rewrite ^/tools/(.*)$ /$1 break;
        proxy_pass $upstream_tools;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # izzy-game — separate compose project, reached over the external shared-net.
    # ^~ + request-time DNS means this route 502s while that project is down
    # rather than breaking nginx startup.
    location ^~ /ics/izzy-game/ {
        set $upstream_izzy http://izzy-game:5003;
        rewrite ^/ics/izzy-game/(.*)$ /$1 break;
        proxy_pass $upstream_izzy;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Stream blog media straight through with no disk buffering.
    location ~* \.(mp4|mov|webm)$ {
        set $upstream_blog http://blog:5001;
        proxy_pass $upstream_blog;
        proxy_buffering off;
    }

    # Everything else -> blog.
    location / {
        set $upstream_blog http://blog:5001;
        proxy_pass $upstream_blog;
    }
}
