<!DOCTYPE html>
<html lang="en">
<head>
  {{template "head" .}}
  <title>Sign In</title>
  <link rel="stylesheet" href="/static/css/link-manager_link-manager.css" />
  <link rel="stylesheet" href="/static/css/auth_login.css" />
</head>
<body>
{{template "header" .}}
<div class="page-root">
  <main>
    <div class="container login-container">
      <div class="box login-box">
        <h1>Sign In</h1>
        <p>Enter your email and you will receive a one-time code. New here? This will create your account.</p>

        <div id="form-status" class="form-status" hidden></div>

        <form id="email-form" class="login-form">
          <div class="field-group">
            <label for="email-input">Email</label>
            <input type="email" id="email-input" placeholder="you@example.com" autofocus />
            <span class="field-error" id="email-error" hidden></span>
          </div>
          <div id="turnstile-container"></div>
          <button type="submit" id="send-code-btn" class="btn btn-primary">Continue</button>
        </form>

        <form id="code-form" class="login-form" hidden>
          <p>We sent a code to <strong id="code-email-display"></strong>.</p>
          <div class="field-group">
            <label for="code-input">Verification code</label>
            <input type="text" id="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="123456" />
            <span class="field-error" id="code-error" hidden></span>
          </div>
          <div class="code-submit-row">
            <button type="button" id="resend-btn" class="link-inline">Resend code</button>
            <button type="submit" id="verify-btn" class="btn btn-primary">Verify</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>
{{template "footer" .}}

<script>
  window.BOOT = { turnstileSiteKey: {{.TurnstileSiteKey}} };
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstile&render=explicit" defer></script>
<script src="/static/js/auth_login.js"></script>
</body>
</html>
